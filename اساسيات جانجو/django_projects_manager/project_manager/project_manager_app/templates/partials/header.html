{% load i18n %}
<nav class="navbar navbar-expand-lg navbar-dark p-3" style="background-color: #ffbf00;">

  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'project_list' %}">{% trans 'project management'  %}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">{% trans 'Home'  %}</a>
        </li>
        


      </ul>
      {% if user.is_authenticated %}
        <div class="d-flex ms-auto align-items-center">

            <div class="dropdown me-2">
                <button
                    class="btn btn-secondary dropdown-toggle"
                    type="button"
                    id="dropdownMenuButton"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                    {{ user.username }}
                </button>

                <ul class="dropdown-menu dropdown-menu-end"
                    aria-labelledby="dropdownMenuButton">

                    <li>
                        <a class="dropdown-item" href="{% url 'profile' %}">
                            {% trans 'Profile'  %}
                            
                        </a>
                    </li>

                    <li>
                      <form method="post" action="{% url 'logout' %}">
                          {% csrf_token %}
                          <button type="submit" class="dropdown-item">
                              {% trans 'Logout'  %}
                          </button>
                      </form>
                    </li>



                </ul>
            </div>

            <form method="get" action="{% url 'project_list' %}" class="d-flex ms-auto" > 
              <div class="input-group">
                  <input 
                  type="text"
                  name="q"
                  class="form-control"
                  placeholder="{% trans 'Search'  %}"
                  value="{{request.GET.q}}"
    
                  
                  >
                  <button class="btn btn-outline-light" type="submit">
                      <i class="bi bi-search"></i>
    
                  </button>
              </div>
    
            </form>
        </div>
                
      {% else %}
          <a class="btn btn-outline-light ms-auto" id="login" href="{% url 'Login' %}">
            {% trans 'sign in ' %}
          </a>
          <a class="btn btn-outline-light ms-auto" id="register" href="{% url 'Register' %}">
            {% trans 'register' %}
          </a>
      {% endif %}


      
    </div>
  </div>
</nav>
<style>
body{

    background-color: rgb(105, 105, 105);
}
#login{
  margin-right: 0vw;
}
</style>
